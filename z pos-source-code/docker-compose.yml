version: '3.8'

services:
  # Database
  db:
    image: mysql:8.0
    container_name: pos-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pos
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Backend (Spring Boot)
  backend:
    build: ./pos-backend
    container_name: pos-backend
    restart: always
    depends_on:
      - db
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=pos
      - DB_USERNAME=root
      - DB_PASSWORD=root
    networks:
      - pos-network

  # Vision/AI Service (YOLOv8)
  vision:
    build: ./pos-vision
    container_name: pos-vision
    restart: always
    ports:
      - "8080:8080"
    devices:
      - "/dev/video0:/dev/video0" # Pass the host webcam to the container (Linux only)
    environment:
      - VISION_HOST=0.0.0.0
      - VISION_PORT=8080
      - SHOW_VIEWFINDER=false
    networks:
      - pos-network

  # Frontend (Vite/React)
  frontend:
    build: ./pos-frontend-vite
    container_name: pos-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge

volumes:
  db_data:
